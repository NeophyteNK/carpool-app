<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carpool — Classroom Display</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #F6F3EC;
    --bg: #0F2119;
    --panel: #16301F;
    --gate-green: #2E9A6B;
    --gate-green-bright: #3FD98C;
    --line-gray: #325240;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--ink);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 22px 40px;
    border-bottom: 1px solid var(--line-gray);
  }
  header .brand { font-family: 'DM Serif Display', serif; font-size: 22px; }
  header .room { font-size: 15px; color: #9FBCA9; }
  header .clock { font-size: 22px; font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }

  main { flex: 1; padding: 34px 40px; overflow-y: auto; }

  .panel-label {
    font-size: 13px; text-transform: uppercase; letter-spacing: 0.16em;
    color: var(--gate-green-bright); margin-bottom: 20px; font-weight: 700;
  }

  .entry {
    background: linear-gradient(180deg, #1B4A34, #123322);
    border: 2px solid var(--gate-green-bright);
    border-radius: 18px;
    padding: 22px 28px;
    margin-bottom: 16px;
    animation: pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 rgba(63,217,140,0); }
    50% { box-shadow: 0 0 30px rgba(63,217,140,0.3); }
  }
  .entry-child { font-family: 'DM Serif Display', serif; font-size: 40px; line-height: 1.2; }
  .entry-meta { font-size: 15px; color: #9FBCA9; margin-top: 4px; }

  .empty-state { font-size: 16px; color: #6B8A78; }

  .section-label {
    font-size: 13px; text-transform: uppercase; letter-spacing: 0.16em;
    color: #6B8A78; margin: 28px 0 14px; font-weight: 700;
  }
  .picked-grid { display: flex; flex-wrap: wrap; gap: 10px; }
  .picked-chip {
    background: var(--panel); border: 1px solid var(--line-gray);
    padding: 8px 16px; border-radius: 999px; font-size: 15px; color: #7FA893;
    display: flex; align-items: center; gap: 6px;
  }
  .picked-chip .check { color: var(--gate-green-bright); }

  footer { padding: 14px 40px; font-size: 12px; color: #6B8A78; text-align: right; }
  footer span { cursor: pointer; text-decoration: underline; }
</style>
</head>
<body>

<div id="setup" style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:18px;">
  <div style="font-family:'DM Serif Display',serif;font-size:28px;">Room setup</div>
  <input id="setupRoom" placeholder="Room number" style="padding:12px;font-size:16px;border-radius:8px;text-align:center;">
  <button id="setupSave" style="padding:14px 30px;font-size:16px;border-radius:10px;border:none;background:#2E9A6B;color:#fff;cursor:pointer;">Save Room</button>
</div>

<div id="display" style="display:none;height:100vh;flex-direction:column;">
  <header>
    <div class="brand">Carpool</div>
    <div class="room" id="roomLabel"></div>
    <div class="clock" id="clock"></div>
  </header>
  <main>
    <div class="panel-label">Waiting for pickup — send them outside</div>
    <div id="entries"></div>
    <div class="section-label">Already picked up today</div>
    <div id="pickedGrid" class="picked-grid"></div>
  </main>
  <footer>
    <span onclick="showSetup()">Change room</span>
  </footer>
</div>

<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxbk71KBnquE8aGmmWpjjGGeJSBdUzDE5xtOjYGc2PMQAFv_hVVVN9ymqUwWYTgYyid/exec';
const ROOM_KEY = 'carpool_room';

function getRoom() {
  const raw = localStorage.getItem(ROOM_KEY);
  return raw ? JSON.parse(raw) : null;
}
function saveRoom(r) { localStorage.setItem(ROOM_KEY, JSON.stringify(r)); }

function showSetup() {
  document.getElementById('setup').style.display = 'flex';
  document.getElementById('display').style.display = 'none';
}
function showDisplay() {
  document.getElementById('setup').style.display = 'none';
  document.getElementById('display').style.display = 'flex';
}

document.getElementById('setupSave').onclick = () => {
  const classroom = document.getElementById('setupRoom').value.trim();
  if (!classroom) { alert('Enter a room number.'); return; }
  saveRoom({ classroom });
  init();
};

function updateClock() {
  const el = document.getElementById('clock');
  if (el) el.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function entryHtml(f) {
  const mainName = f.child || f.family;
  const metaParts = [];
  if (f.child && f.family) metaParts.push(f.family);
  if (f.notes) metaParts.push(f.notes);
  const meta = metaParts.length ? `<div class="entry-meta">${metaParts.join(' · ')}</div>` : '';
  return `<div class="entry"><div class="entry-child">${mainName}</div>${meta}</div>`;
}

function pickedChipHtml(f) {
  const mainName = f.child || f.family;
  return `<div class="picked-chip"><span class="check">✓</span>${mainName}</div>`;
}

async function poll(room) {
  try {
    const url = new URL(APPS_SCRIPT_URL);
    url.searchParams.set('action', 'tvdata');
    url.searchParams.set('classroom', room.classroom);
    const res = await fetch(url);
    const data = await res.json();
    if (!data.ok) return;

    const waiting = data.families.filter(f => f.status === 'InLine');
    const pickedUp = data.families.filter(f => f.status === 'GotEm');

    const entries = document.getElementById('entries');
    entries.innerHTML = waiting.length
      ? waiting.map(entryHtml).join('')
      : `<div class="empty-state">No families waiting.</div>`;

    const pickedGrid = document.getElementById('pickedGrid');
    pickedGrid.innerHTML = pickedUp.length
      ? pickedUp.map(pickedChipHtml).join('')
      : `<div class="empty-state">No one picked up yet today.</div>`;
  } catch (err) {
    console.error(err);
  }
}

function init() {
  const room = getRoom();
  if (!room) { showSetup(); return; }
  showDisplay();
  document.getElementById('roomLabel').textContent = `Room ${room.classroom}`;
  updateClock();
  setInterval(updateClock, 1000);
  poll(room);
  setInterval(() => poll(room), 10000);
}

init();
</script>
</body>
</html>
